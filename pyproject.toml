[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "strands-robots-sim"
dynamic = ["version"]
description = "Heavy NVIDIA simulation backends (Isaac Sim, Newton) for strands-robots"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "AWS", email = "opensource@amazon.com"},
]
keywords = ["robots", "agents", "isaac-sim", "newton", "warp", "libero", "strands", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "strands-agents",
    "numpy>=1.21.0",
    "Pillow>=8.0.0",
]

[project.optional-dependencies]
newton = [
    "strands-robots-sim",
    "newton-physics>=1.3.0,<2.0.0",
    "warp-lang>=1.13.0,<2.0.0",
]
dev = [
    "black",
    "isort",
    "flake8",
    "pytest>=7.0",
    "pytest-cov",
    "mypy>=1.0",
    "ruff>=0.4.0",
]
all = [
    "strands-robots-sim[newton]",
]

[project.urls]
Homepage = "https://github.com/strands-labs/robots-sim"
Documentation = "https://github.com/strands-labs/robots-sim#readme"
Repository = "https://github.com/strands-labs/robots-sim.git"
Issues = "https://github.com/strands-labs/robots-sim/issues"

[tool.hatch.metadata]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["strands_robots_sim"]

[tool.hatch.envs.default]
dependencies = [
    "black",
    "isort",
    "flake8",
    "pytest>=7.0",
    "pytest-cov",
    "mypy>=1.0",
    "ruff>=0.4.0",
]

[tool.hatch.envs.default.scripts]
test = "pytest strands_robots_sim/newton/tests/ -v --tb=short"
test-unit = "pytest strands_robots_sim/newton/tests/test_unit.py -v"
lint = [
    "ruff check strands_robots_sim/",
    "mypy strands_robots_sim/ --ignore-missing-imports",
]
format = [
    "ruff format strands_robots_sim/",
    "ruff check --fix strands_robots_sim/",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["strands_robots_sim/newton/tests"]
markers = [
    "gpu: marks tests that require a CUDA GPU (deselect with '-m \"not gpu\"')",
]

[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
